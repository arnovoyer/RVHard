<body>
  <header>
    <nav id="navigation-container"></nav>
  </header>

  <main class="probetraining-container">
    <div class="probetraining-card" data-aos="fade-up">
      <h1><i class="fa-solid fa-bicycle" style="color:#ffc107; margin-right:0.4rem;"></i> Probetraining Anfragen</h1>
      <p class="einleitung">
        Du möchtest den RV Hard und unser Training unverbindlich kennenlernen?<br>
        Fülle einfach das Formular aus – wir melden uns <strong>telefonisch</strong> bei dir, um einen passenden Termin für ein kostenloses Probetraining zu vereinbaren!
      </p>

      <div id="form-status" class="form-status" role="status" aria-live="polite"></div>

      <form id="probetraining-form" method="POST" action="/training/probetraining-send.php" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="name_kind">Name Kind<span class="pflicht">*</span></label>
            <input type="text" id="name_kind" name="name_kind" required placeholder="Max Mustermann" maxlength="80">
          </div>
          <div class="form-group">
            <label for="name_eltern">Name Elternteil<span class="pflicht">*</span></label>
            <input type="text" id="name_eltern" name="name_eltern" required placeholder="Anna Mustermann" maxlength="80">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="alter_kind">Alter Kind<span class="pflicht">*</span></label>
            <input type="number" id="alter_kind" name="alter_kind" required min="3" max="18" placeholder="z. B. 10">
          </div>
          <div class="form-group">
            <label for="telefon">Telefonnummer Rückruf<span class="pflicht">*</span></label>
            <input type="tel" id="telefon" name="telefon" required pattern="[0-9+\s()-]{8,25}" placeholder="+43 664 123 45 67" maxlength="30">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="sparte">Gewünschte Sparte</label>
            <select id="sparte" name="sparte">
              <option value="">-- Bitte wählen (optional) --</option>
              <option value="Mountainbike">Mountainbike</option>
              <option value="Rennrad">Rennrad</option>
              <option value="Triathlon">Triathlon</option>
              <option value="Noch unsicher">Noch unsicher / Unentschieden</option>
            </select>
            <p class="sparten-hinweis"><i class="fa-solid fa-circle-info" style="color:#ffc107;"></i> Keine Vorkenntnisse nötig!</p>
          </div>
          <div class="form-group">
            <label for="email">E-Mail (optional)</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" maxlength="120">
          </div>
        </div>

        <div class="form-group">
          <label for="nachricht">Weitere Infos (optional)</label>
          <textarea id="nachricht" name="nachricht" rows="3" placeholder="Erfahrung, Wünsche, Fragen, verfügbare Tage etc. – alles was für uns wichtig ist!" maxlength="1000"></textarea>
        </div>

        <label class="form-datenschutz" for="datenschutz_check">
          <input type="checkbox" id="datenschutz_check" name="datenschutz" value="1" required>
          <span class="dse-label-text">
            <i class="fa-solid fa-shield-halved"></i>
            <strong>Ich stimme zu</strong>, dass meine oben eingegebenen personenbezogenen Daten (Name, Alter, Telefonnummer etc.)
            sowie meine IP-Adresse zur Bearbeitung meiner Anfrage und zur Terminvereinbarung verarbeitet und temporär gespeichert werden.
            <span class="pflicht">*</span><br>
            Mehr Infos und dein Widerrufsrecht findest du in der <a href="/datenschutz.html" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a>.
          </span>
        </label>

        <div class="form-submit-row">
          <button type="submit" id="submit-btn" class="gelber-button">
            <i class="fa-solid fa-paper-plane"></i>
            Anfrage senden
          </button>
        </div>
      </form>
    </div>

    fetch("/assets/footer.html")
      .then(r => r.text())

        document.getElementById("site-footer").innerHTML = html;

  <script>
    window.addEventListener('load', () => {
      AOS.init({
        duration: 900,
        once: true
      });
      AOS.refresh();
    });
  </script>
  <script>
    (function () {
      const form = document.getElementById('probetraining-form');
      const statusEl = document.getElementById('form-status');
      const submitBtn = document.getElementById('submit-btn');

      function zeigeStatus(typ, text) {
        statusEl.className = 'form-status ' + (typ === 'ok' ? 'erfolg' : 'fehler');
        statusEl.innerHTML = '';
        const icon = document.createElement('i');
        icon.className = typ === 'ok' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
        icon.style.marginRight = '0.5rem';
        statusEl.appendChild(icon);
        statusEl.appendChild(document.createTextNode(text));
        statusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const dseCheckbox = document.getElementById('datenschutz_check');
        if (dseCheckbox && !dseCheckbox.checked) {
          zeigeStatus('fehler', 'Bitte klicke die Datenschutz-Checkbox an (oben links), um deine Einwilligung zu geben.');
          dseCheckbox.focus();
          dseCheckbox.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        if (!form.checkValidity()) {
          zeigeStatus('fehler', 'Bitte fülle alle Pflichtfelder (mit * markiert) korrekt aus.');
          form.reportValidity();
          return;
        }

        submitBtn.disabled = true;
        const origText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Wird gesendet...';

        try {
          const formData = new FormData(form);
          const resp = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json',
              'X-Requested-With': 'XMLHttpRequest'
            }
          });

          let data = null;
          let rawText = '';
          try {
            rawText = await resp.text();
            try { data = JSON.parse(rawText); } catch (_) { }
          } catch (_) { }

          const isOk = (resp.ok && (
            (data && (data.ok === true || data.status === 'success')) ||
            (rawText.includes('✅') && rawText.includes('Vielen Dank'))
          ));

          if (isOk) {
            const successMsg =
              (data && (data.msg || (data.html))) ||
              'Vielen Dank! Deine Anfrage wurde erfolgreich versendet. Wir melden uns telefonisch bei dir!';
            zeigeStatus('ok', successMsg);
            form.reset();
          } else {
            let fehler = 'Unbekannter Server-Fehler.';
            if (data && data.msg) {
              fehler = data.msg;
            } else if (data && data.html) {
              fehler = 'Server antwortete ohne JSON Format. Bitte erneut versuchen.';
            } else if (resp.status === 400) {
              fehler = 'Server hat die Anfrage (HTTP 400) abgelehnt. Bitte Cookies + Cache löschen und erneut probieren.';
            } else if (!resp.ok) {
              fehler = 'Server-Fehler (HTTP ' + resp.status + '). Bitte kurz warten und erneut senden!';
            } else if (rawText.length > 0) {
              fehler = 'Unerwartete Server-Antwort. Bitte erneut versuchen.';
            }
            zeigeStatus('fehler', fehler + ' Alternativ: Direkte E-Mail an vorstand@rv-hard.at schreiben.');
          }
        } catch (err) {
          zeigeStatus('fehler', 'Verbindungsfehler. Bitte prüfe deine Internetverbindung oder schreibe uns direkt an vorstand@rv-hard.at.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = origText;
        }
      });
    })();
  </script>
