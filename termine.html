        content="Alle aktuellen und kommenden Termine des RV Hard - Veranstaltungen, Rennen und Vereinsaktivitäten auf einen Blick.">

    <link rel="stylesheet" href="/assets/termine.css?v=20261111a">

<body>
    <header>
        <nav id="navigation-container"></nav>
    </header>
    <main class="verein-container">
        <section class="card">
            <h1>Unsere Termine</h1>
        </section>

        <section class="termine-liste">
            <h2 class="section-title">Bevorstehende Events</h2>
            <div id="bevorstehende-events" class="event-grid"></div>
            <button id="toggle-vergangene" class="gelber-button">Vergangene Events anzeigen</button>
            <div id="vergangene-events" class="event-grid hidden"></div>
        </section>
    </main>
    <script>
        const EVENTS_DATA_URL = "/data/termine/termine.json";

        function parseDateOnly(datumString) {
            const [year, month, day] = datumString.split('-').map(Number);
            return new Date(year, month - 1, day);
        }

        function normalizeEventsPayload(payload) {
            if (Array.isArray(payload)) {
                return payload;
            }
            if (payload && Array.isArray(payload.events)) {
                return payload.events;
            }
            return [];
        }

        function splitEventsByDate(events) {
            const heute = new Date();
            const heuteOhneUhrzeit = new Date(heute.getFullYear(), heute.getMonth(), heute.getDate());

            const bevorstehend = events
                .filter(e => parseDateOnly(e.datum) >= heuteOhneUhrzeit)
                .sort((a, b) => parseDateOnly(a.datum) - parseDateOnly(b.datum));

            const vergangen = events
                .filter(e => parseDateOnly(e.datum) < heuteOhneUhrzeit)
                .sort((a, b) => parseDateOnly(b.datum) - parseDateOnly(a.datum));

            return { bevorstehend, vergangen };
        }

        function renderEvents(containerId, events) {
            const container = document.getElementById(containerId);
            events.forEach(event => {
                const card = document.createElement('div');
                card.classList.add('modern-event-card');

                const titelElement = document.createElement('h3');
                titelElement.classList.add('event-title');
                titelElement.textContent = event.titel;


                const datumElement = document.createElement('p');
                const date = parseDateOnly(event.datum);
                datumElement.textContent = `${date.getDate().toString().padStart(2, '0')}.${(date.getMonth() + 1).toString().padStart(2, '0')}.${date.getFullYear()} ${event.zeit || ''}`;
                datumElement.classList.add('event-date-time');

                const beschreibungElement = document.createElement('p');
                beschreibungElement.textContent = event.beschreibung;

                card.appendChild(titelElement);
                card.appendChild(datumElement);
                card.appendChild(beschreibungElement);

                if (event.sparten?.length) {
                    const spartenElement = document.createElement('p');
                    spartenElement.classList.add('event-sparten');
                    spartenElement.innerHTML = `<strong>Sparten:</strong> ${event.sparten.join(", ")}`;
                    card.appendChild(spartenElement);
                }

                if (event.alter) {
                    const alterElement = document.createElement('p');
                    alterElement.classList.add('event-alter');
                    alterElement.innerHTML = `<strong>Altersklassen:</strong> ${event.alter}`;
                    card.appendChild(alterElement);
                }

                if (event.ort) {
                    const ortContainer = document.createElement('div');
                    ortContainer.classList.add('event-location-list');

                    const orte = event.ort
                        .split(/\s*;\s*(?![^()]*\))/);

                    orte.forEach(rawOrt => {
                        const ort = rawOrt.replace(/^Start:\s*/i, '').trim();
                        if (!ort) return;

                        const ortLink = document.createElement('a');
                        ortLink.classList.add('event-location');
                        ortLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ort)}`;
                        ortLink.target = "_blank";
                        ortLink.rel = "noopener";
                        ortLink.innerHTML = `<i class="fa-solid fa-location-dot"></i> ${ort}`;

                        ortContainer.appendChild(ortLink);
                    });

                    card.appendChild(ortContainer);
                }

                if (event.link) {
                    const linkButton = document.createElement('a');
                    linkButton.href = event.link;
                    linkButton.classList.add('event-button', 'gelber-button');
                    linkButton.textContent = 'Mehr Infos';

                    linkButton.style.alignSelf = 'flex-start';

                    card.appendChild(linkButton);
                }

                const kalenderButton = document.createElement('button');
                kalenderButton.classList.add('event-button', 'kalender-button');
                kalenderButton.innerHTML = '<i class="fa-regular fa-calendar-plus"></i> Zum Kalender hinzufügen';
                kalenderButton.addEventListener('click', () => addToCalendar(event));
                card.appendChild(kalenderButton);

                container.appendChild(card);
            });
        }

        function setupVergangeneToggle() {
            const toggleBtn = document.getElementById("toggle-vergangene");
            const vergangeneContainer = document.getElementById("vergangene-events");

            toggleBtn.addEventListener("click", () => {
                vergangeneContainer.classList.toggle("hidden");
                toggleBtn.textContent = vergangeneContainer.classList.contains("hidden")
                    ? "Vergangene Events anzeigen"
                    : "Vergangene Events verbergen";
            });
        }

        function renderEmptyState(containerId, text) {
            const container = document.getElementById(containerId);
            const info = document.createElement("p");
            info.textContent = text;
            info.classList.add("event-empty");
            container.appendChild(info);
        }

        async function loadEvents() {
            const response = await fetch(EVENTS_DATA_URL, { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`Termine konnten nicht geladen werden: ${response.status}`);
            }
            const payload = await response.json();
            return normalizeEventsPayload(payload);
        }

        async function initTerminePage() {
            const toggleBtn = document.getElementById("toggle-vergangene");

            try {
                const events = await loadEvents();
                const { bevorstehend, vergangen } = splitEventsByDate(events);

                if (bevorstehend.length > 0) {
                    renderEvents("bevorstehende-events", bevorstehend);
                } else {
                    renderEmptyState("bevorstehende-events", "Aktuell sind keine bevorstehenden Events eingetragen.");
                }

                if (vergangen.length > 0) {
                    renderEvents("vergangene-events", vergangen);
                    setupVergangeneToggle();
                } else {
                    toggleBtn.disabled = true;
                    toggleBtn.style.opacity = "0.6";
                    toggleBtn.style.cursor = "not-allowed";
                    toggleBtn.textContent = "Keine vergangenen Events";
                }
            } catch (error) {
                console.error(error);
                renderEmptyState("bevorstehende-events", "Termine konnten aktuell nicht geladen werden.");
                toggleBtn.disabled = true;
                toggleBtn.style.opacity = "0.6";
                toggleBtn.style.cursor = "not-allowed";
            }
        }

        function addToCalendar(event) {
            let timePart = '';
            if (event.zeit?.includes('-')) {
                timePart = event.zeit.split('-')[0].trim();
            } else if (event.zeit && event.zeit !== 'ganztags' && event.zeit !== 'halbtags') {
                timePart = event.zeit;
            }

            const [year, month, day] = event.datum.split('-').map(Number);
            const [hours, minutes] = (timePart || '00:00').split(':').map(Number);
            const date = new Date(year, month - 1, day, hours, minutes);

            const utcYear = date.getUTCFullYear();
            const utcMonth = String(date.getUTCMonth() + 1).padStart(2, '0');
            const utcDay = String(date.getUTCDate()).padStart(2, '0');
            const utcHours = String(date.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(date.getUTCMinutes()).padStart(2, '0');

            const startTime = `${utcYear}${utcMonth}${utcDay}T${utcHours}${utcMinutes}00Z`;
            const endTime = `${utcYear}${utcMonth}${utcDay}T${String(parseInt(utcHours) + 1).padStart(2, '0')}${utcMinutes}00Z`;

            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&dates=${startTime}/${endTime}&text=${encodeURIComponent(event.titel)}&details=${encodeURIComponent(event.beschreibung)}&location=${encodeURIComponent(event.ort || '')}&sf=true&output=xml`;
            window.open(url, '_blank');
        }

        initTerminePage();
    </script>

        fetch("/assets/footer.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("site-footer").innerHTML = html;
            });
    </script>
</body>
