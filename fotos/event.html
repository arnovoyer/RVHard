<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foto-Galerie Event | RV Hard</title>
    <meta name="description" content="Foto-Galerie eines RV Hard Events.">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"></noscript>
    <!-- 🔥🔥 SUBDOMAIN KOMPATIBEL! RELATIVE PFAD-ANGABEN! -->
    <script>
        (function() {
            const here = String(window.location.pathname || '/');
            const b = (here.indexOf('/fotos/') === 0 || here.endsWith('/fotos') || here === '/fotos')
                ? '/fotos' : '';
            const prefixCss = (b === '' ? './' : b + '/') + 'assets/';
            const assetsBase = (b === '' ? './' : '../') + 'assets/';
            const logo = assetsBase + 'img/logo/RV_Hard_Logo.webp';
            document.write(`<link rel="icon" type="image/png" href="${logo}?v=20260918">`);
            document.write(`<link rel="stylesheet" href="${assetsBase}style.css?v=20260918">`);
            document.write(`<link rel="stylesheet" href="${prefixCss}galerie.css?v=20260918">`);
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav id="navigation-container"></nav>
    </header>

    <main>
        <!-- 🔥 WICHTIG! fg-event-content wird in fgInitEventPage() ZWINGEND benötigt!
             Ohne diese ID wird die Galerie NIEMALS geladen (return sofort!) -->
        <section class="fg-container" id="fg-event-content">

            <!-- BREADCRUMB (SUBDOMAIN KOMPATIBEL! RELATIVE LINKS!) -->
            <div class="fg-breadcrumb">
                <script>
                    (function(){
                        const here = String(window.location.pathname || '/');
                        const b = (here.indexOf('/fotos/')===0 || here.endsWith('/fotos') || here==='/fotos') ? '/fotos' : '';
                        const home = (b === '' ? './index.html' : b + '/');
                        const root = (b === '' ? './index.html' : '/');
                        document.write(
                            `<a href="${root}"><i class="fa-solid fa-house"></i> Startseite</a>` +
                            `<span class="sep">›</span>` +
                            `<a href="${home}"><i class="fa-regular fa-images"></i> Foto-Galerie</a>` +
                            `<span class="sep">›</span>` +
                            `<span id="fg-bc-event">Event wird geladen…</span>`
                        );
                    })();
                </script>
            </div>

            <!-- HEADER / EVENT INFOS -->
            <div class="fg-section" data-aos="fade-up">
                <!-- 🔥 fg-event-name NUR EINMAL (für H1!) jetzt korrekt! -->
                <h1 id="fg-event-name" style="font-size:2rem;"><i class="fa-solid fa-camera-retro" style="color:#f5b301;"></i> Event wird geladen…</h1>
                <p style="color:#777; margin: 0.25rem 0 0 0; font-size:0.92rem;">
                    <span id="fg-event-date"></span><span id="fg-event-location"></span>
                </p>
                <div id="fg-event-head-meta" style="margin-top: 0.85rem; display:flex; flex-wrap:wrap; gap: 14px 20px; font-size:0.88rem; color:#555;"></div>

                <div style="margin-top: 1rem;">
                    <!-- RELATIVER LINK zurück zur Übersicht (funktioniert auf Subdomain + Unterordner!) -->
                    <script>
                        (function(){
                            const here = String(window.location.pathname || '/');
                            const b = (here.indexOf('/fotos/')===0 || here.endsWith('/fotos') || here==='/fotos') ? '/fotos' : '';
                            const home = (b === '' ? './index.html' : b + '/');
                            document.write(`<a href="${home}" class="fg-btn fg-btn--outline" style="margin-right: 0.5rem; margin-bottom: 0.5rem;">
                                <i class="fa-solid fa-arrow-left"></i> Alle Events
                            </a>`);
                        })();
                    </script>
                    <span id="fg-external-link"></span>
                </div>

                <!-- STARTNUMMER SUCHE (SICHTBAR + FUNKTIONAL!) -->
                <div style="margin-top: 1.2rem; max-width: 460px;">
                    <label for="fg-bib" style="display:block; margin: 0 0 0.45rem; font-size: 0.82rem; font-weight: 700; color: #e7ebef; letter-spacing: 0.01em;">
                        <i class="fa-solid fa-hashtag" style="color: #ffc107;"></i> Suche nach Startnummer
                    </label>
                    <div style="display:flex; gap: 8px; align-items:stretch;">
                        <div style="flex:1; position:relative;">
                            <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#8893a3; font-size:14px;"></i>
                            <input type="text" id="fg-bib" inputmode="numeric" placeholder="z.B. 42, 108, 256"
                                style="width:100%; padding: 12px 14px 12px 40px; background:#232a33; border:1.5px solid #313b49; border-radius:10px; color:#f3f5f7; font-family:inherit; font-size:15px; font-weight:500; outline:none; transition: border-color .2s, box-shadow .2s;"
                                onfocus="this.style.borderColor='#ffc107'; this.style.boxShadow='0 0 0 4px rgba(255,193,7,.15)'"
                                onblur="this.style.borderColor='#313b49'; this.style.boxShadow='none'">
                        </div>
                        <button id="fg-bib-reset" type="button" title="Filter zurücksetzen"
                            style="padding: 0 14px; background:#232a33; border:1.5px solid #313b49; border-radius:10px; color:#98a2b3; cursor:pointer; font-family:inherit; transition: all .2s;"
                            onmouseover="this.style.background='#2a3240'; this.style.color='#e7ebef';"
                            onmouseout="this.style.background='#232a33'; this.style.color='#98a2b3';">
                            <i class="fa-solid fa-xmark" style="font-size:15px;"></i>
                        </button>
                    </div>
                    <div style="margin-top: 6px; font-size: 11.5px; color:#7f8a9a; line-height:1.45;">
                        <i class="fa-solid fa-circle-info" style="color:#5a6472; margin-right:4px;"></i>
                        Mehrere Nummern durch <strong style="color:#9aa5b5;">Leerzeichen</strong> trennen (z.B. <code style="background:#1e242d; padding:1px 6px; border-radius:4px; color:#ffd24a; font-size:11px;">42 256</code>)
                    </div>
                </div>

                <!-- GALLERY -->
                <div id="fg-gallery" class="fg-gallery" style="margin-top: 1.5rem;">
                    <div class="fg-empty"><strong>Galerie wird geladen…</strong></div>
                </div>

            </div>

        </section>
    </main>

    <!-- ============ LIGHTBOX ============ -->
    <div id="fg-lightbox" class="fg-lightbox" role="dialog" aria-modal="true" aria-label="Bildbetrachter">
        <div class="fg-lightbox__inner">
            <div class="fg-lightbox__img-wrap">
                <button class="fg-lightbox__close" aria-label="Schließen">✕</button>
                <button class="fg-lightbox__nav fg-lightbox__nav--prev" aria-label="Vorheriges Bild">‹</button>
                <button class="fg-lightbox__nav fg-lightbox__nav--next" aria-label="Nächstes Bild">›</button>
            </div>
            <aside class="fg-lightbox__info">
                <h3>Bild</h3>
            </aside>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <!-- 🔥🔥 SUBDOMAIN KOMPATIBLE JS-Links! -->
    <script>
        (function() {
            const here = String(window.location.pathname || '/');
            const b = (here.indexOf('/fotos/') === 0 || here.endsWith('/fotos') || here === '/fotos') ? '/fotos' : '';
            const assetBase = (b === '' ? './' : '../') + 'assets/';
            const galerieBase = (b ? b + '/' : './') + 'assets/';
            document.write(`<script src="${assetBase}navigation-loader.js?v=20260918" defer><\/script>`);
            document.write(`<script src="${assetBase}nav.js?v=20260918" defer><\/script>`);
            document.write(`<script src="${galerieBase}galerie.js?v=20260918" defer><\/script>`);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.js" defer></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof AOS !== 'undefined') {
                AOS.init({ duration: 700, once: true, mirror: false });
            }
        });
    </script>
</body>
</html>
