<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foto-Galerie Event | RV Hard</title>
    <meta name="description" content="Foto-Galerie eines RV Hard Events.">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"></noscript>
    <!-- 🔥🔥 SUBDOMAIN KOMPATIBEL! RELATIVE PFAD-ANGABEN! -->
    <script>
        (function() {
            const here = String(window.location.pathname || '/');
            const b = (here.indexOf('/fotos/') === 0 || here.endsWith('/fotos') || here === '/fotos')
                ? '/fotos' : '';
            const prefixCss = (b === '' ? './' : b + '/') + 'assets/';
            const assetsBase = (b === '' ? './' : '../') + 'assets/';
            const logo = assetsBase + 'img/logo/RV_Hard_Logo.webp';
            document.write(`<link rel="icon" type="image/png" href="${logo}?v=20260918">`);
            document.write(`<link rel="stylesheet" href="${assetsBase}style.css?v=20260918">`);
            document.write(`<link rel="stylesheet" href="${prefixCss}galerie.css?v=20260918">`);
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav id="navigation-container"></nav>
    </header>

    <main>
        <!-- 🔥 WICHTIG! fg-event-content wird in fgInitEventPage() ZWINGEND benötigt!
             Ohne diese ID wird die Galerie NIEMALS geladen (return sofort!) -->
        <section class="fg-container" id="fg-event-content">

            <!-- BREADCRUMB (SUBDOMAIN KOMPATIBEL! RELATIVE LINKS!) -->
            <div class="fg-breadcrumb">
                <script>
                    (function(){
                        const here = String(window.location.pathname || '/');
                        const b = (here.indexOf('/fotos/')===0 || here.endsWith('/fotos') || here==='/fotos') ? '/fotos' : '';
                        const home = (b === '' ? './index.html' : b + '/');
                        const root = (b === '' ? './index.html' : '/');
                        document.write(
                            `<a href="${root}"><i class="fa-solid fa-house"></i> Startseite</a>` +
                            `<span class="sep">›</span>` +
                            `<a href="${home}"><i class="fa-regular fa-images"></i> Foto-Galerie</a>` +
                            `<span class="sep">›</span>` +
                            `<span id="fg-bc-event">Event wird geladen…</span>`
                        );
                    })();
                </script>
            </div>

            <!-- HEADER / EVENT INFOS -->
            <div class="fg-section" data-aos="fade-up">
                <!-- 🔥 fg-event-name NUR EINMAL (für H1!) jetzt korrekt! -->
                <h1 id="fg-event-name" style="font-size:2rem;"><i class="fa-solid fa-camera-retro" style="color:#f5b301;"></i> Event wird geladen…</h1>
                <p style="color:#777; margin: 0.25rem 0 0 0; font-size:0.92rem;">
                    <span id="fg-event-date"></span><span id="fg-event-location"></span>
                </p>
                <div id="fg-event-head-meta" style="margin-top: 0.85rem; display:flex; flex-wrap:wrap; gap: 14px 20px; font-size:0.88rem; color:#555;"></div>

                <!-- 🔥 ZEILE 1: Links = Alle Events Button, Rechts = Such-Modus Toggle Buttons (GLEICHE HÖHE!) -->
                <div style="
                    margin-top: 1rem;
                    display:flex;
                    align-items:center;
                    justify-content:space-between;
                    gap: 16px;
                    flex-wrap: wrap;
                ">
                    <!-- RELATIVER LINK zurück zur Übersicht (funktioniert auf Subdomain + Unterordner!) -->
                    <div style="display:flex; align-items:center; gap: 8px; flex-wrap:wrap;">
                        <script>
                            (function(){
                                const here = String(window.location.pathname || '/');
                                const b = (here.indexOf('/fotos/')===0 || here.endsWith('/fotos') || here==='/fotos') ? '/fotos' : '';
                                const home = (b === '' ? './index.html' : b + '/');
                                document.write(`<a href="${home}" class="fg-btn fg-btn--outline">
                                    <i class="fa-solid fa-arrow-left"></i> Alle Events
                                </a>`);
                            })();
                        </script>
                        <span id="fg-external-link"></span>
                    </div>

                    <!-- SUCH-MODUS TOGGLE (SEGMENTED CONTROL, HÜBSCH!) – RECHTS in der selben Zeile -->
                    <div id="fg-bibmode-wrap" style="
                        display:flex; align-items:center; gap:4px;
                        background: #f3f4f6;
                        border: 1.5px solid #e5e7eb;
                        padding: 4px;
                        border-radius: 999px;
                        box-shadow: 0 1px 2px rgba(0,0,0,.04);
                    ">
                        <button id="fg-bibmode-exact" type="button"
                            title="Nur exakt gleiche Nummern finden (1 findet NUR #1, NICHT #10, #100!)"
                            style="
                                padding: 8px 18px;
                                border: 0;
                                border-radius: 999px;
                                font-family:'Poppins',sans-serif;
                                font-weight: 700;
                                font-size: 12.5px;
                                cursor: pointer;
                                display:inline-flex;
                                align-items:center;
                                gap:7px;
                                transition: all .2s ease;
                                white-space: nowrap;
                            ">
                            <i class="fa-solid fa-crosshairs" style="font-size:13px;"></i>
                            Exakt
                        </button>
                        <button id="fg-bibmode-partial" type="button"
                            title="Teilweise Übereinstimmung finden (1 findet auch #10, #101, #12 etc.)"
                            style="
                                padding: 8px 18px;
                                border: 0;
                                border-radius: 999px;
                                font-family:'Poppins',sans-serif;
                                font-weight: 700;
                                font-size: 12.5px;
                                cursor: pointer;
                                display:inline-flex;
                                align-items:center;
                                gap:7px;
                                transition: all .2s ease;
                                white-space: nowrap;
                            ">
                            <i class="fa-solid fa-magnifying-glass-plus" style="font-size:13px;"></i>
                            Teilweise
                        </button>
                    </div>
                </div>

                <!-- STARTNUMMER SUCHE – ZENTRIERT, WEISS, RV HARD STIL! -->
                <div style="margin: 1.2rem auto 0; max-width: 620px; width: 100%;">
                    <label for="fg-bib" style="display:block; margin: 0 auto 0.65rem; text-align:center; font-size: 0.88rem; font-weight: 700; color: #1a1a1a; letter-spacing: 0.02em;">
                        <i class="fa-solid fa-hashtag" style="color: #ffc107; margin-right:5px;"></i> Suche nach Startnummer
                    </label>

                    <div style="
                        display:flex; gap: 10px; align-items:stretch;
                        background: #fff;
                        border: 2px solid #e5e7eb;
                        border-radius: 14px;
                        padding: 6px;
                        box-shadow: 0 10px 28px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
                        transition: border-color .2s, box-shadow .2s;
                    " id="fg-bib-wrap"
                        onfocusin="document.getElementById('fg-bib-wrap').style.borderColor='#ffc107'; document.getElementById('fg-bib-wrap').style.boxShadow='0 10px 28px rgba(255,193,7,.18), 0 0 0 5px rgba(255,193,7,.12)';"
                        onfocusout="document.getElementById('fg-bib-wrap').style.borderColor='#e5e7eb'; document.getElementById('fg-bib-wrap').style.boxShadow='0 10px 28px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04)';">

                        <div style="flex:1; position:relative; display:flex; align-items:center;">
                            <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:16px; color:#8b95a7; font-size:15px; z-index:1;"></i>
                            <input type="text" id="fg-bib" inputmode="numeric" placeholder="Gib deine Startnummer ein … z.B. 42"
                                style="
                                    width:100%; padding: 14px 18px 14px 46px;
                                    background: transparent !important; border: 0 !important; outline: none !important; box-shadow: none !important;
                                    color: #111827;
                                    font-family: 'Poppins', system-ui, sans-serif; font-size: 16px; font-weight: 600;
                                    border-radius: 10px;
                                ">
                        </div>

                        <button id="fg-bib-reset" type="button" title="Filter zurücksetzen"
                            style="
                                padding: 0 18px;
                                background: #ffc107;
                                background-image: linear-gradient(180deg, #ffd24a, #ffc107);
                                color: #1a1600;
                                border: 1px solid rgba(0,0,0,.08);
                                border-radius: 10px;
                                font-family: inherit; font-weight: 700; font-size: 13px;
                                cursor: pointer;
                                display:inline-flex; align-items:center; gap:7px;
                                transition: filter .18s, transform .1s;
                                box-shadow: 0 4px 10px rgba(255,193,7,.28), 0 1px 0 rgba(255,255,255,.35) inset;
                            "
                            onmouseover="this.style.filter='brightness(1.06)';"
                            onmouseout="this.style.filter='brightness(1)';"
                            onmousedown="this.style.transform='translateY(1px)';"
                            onmouseup="this.style.transform='none';">
                            <i class="fa-solid fa-filter-circle-xmark" style="font-size:15px;"></i>
                            Zurücksetzen
                        </button>
                    </div>

                    <div style="margin-top: 10px; font-size: 12px; color:#6b7280; line-height:1.5; text-align:center;">
                        <i class="fa-solid fa-circle-info" style="color:#9ca3af; margin-right:5px;"></i>
                        Mehrere Nummern durch <strong style="color:#111827;">Leerzeichen</strong> trennen — z.B.
                        <code style="background:#f3f4f6; padding:2px 8px; border-radius:6px; color:#111827; font-size:11.5px; margin:0 3px; border:1px solid #e5e7eb;">42 256</code>
                        zeigt Bilder mit einer dieser Nummern.
                    </div>
                </div>

                <!-- GALLERY -->
                <div id="fg-gallery" class="fg-gallery" style="margin-top: 1.5rem;">
                    <div class="fg-empty"><strong>Galerie wird geladen…</strong></div>
                </div>

            </div>

        </section>
    </main>

    <!-- ============ LIGHTBOX ============ -->
    <div id="fg-lightbox" class="fg-lightbox" role="dialog" aria-modal="true" aria-label="Bildbetrachter">
        <div class="fg-lightbox__inner">
            <div class="fg-lightbox__img-wrap">
                <button class="fg-lightbox__close" aria-label="Schließen">✕</button>
                <button class="fg-lightbox__nav fg-lightbox__nav--prev" aria-label="Vorheriges Bild">‹</button>
                <button class="fg-lightbox__nav fg-lightbox__nav--next" aria-label="Nächstes Bild">›</button>
            </div>
            <aside class="fg-lightbox__info">
                <h3>Bild</h3>
            </aside>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <!-- 🔥🔥 SUBDOMAIN KOMPATIBLE JS-Links! -->
    <script>
        (function() {
            const here = String(window.location.pathname || '/');
            const b = (here.indexOf('/fotos/') === 0 || here.endsWith('/fotos') || here === '/fotos') ? '/fotos' : '';
            const assetBase = (b === '' ? './' : '../') + 'assets/';
            const galerieBase = (b ? b + '/' : './') + 'assets/';
            document.write(`<script src="${assetBase}navigation-loader.js?v=20260918" defer><\/script>`);
            document.write(`<script src="${assetBase}nav.js?v=20260918" defer><\/script>`);
            document.write(`<script src="${galerieBase}galerie.js?v=20260918" defer><\/script>`);
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.js" defer></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof AOS !== 'undefined') {
                AOS.init({ duration: 700, once: true, mirror: false });
            }
        });
    </script>
</body>
</html>
