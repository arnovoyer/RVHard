<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summer Bike Series – Foto-Galerie | RV Hard</title>
    <meta name="description" content="Summer Bike Series Foto-Galerie – alle Bilder der SBS Events. Suche nach deiner Startnummer, deinem Namen und lade deine Fotos herunter.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://rv-hard.at/fotos/">
    <meta property="og:locale" content="de_AT">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RV Hard">
    <meta property="og:title" content="Summer Bike Series – Foto-Galerie | RV Hard">
    <meta property="og:description" content="SBS Fotos – suche nach deiner Startnummer und lade deine Bilder herunter.">
    <meta property="og:url" content="https://rv-hard.at/fotos/">
    <meta property="og:image" content="https://rv-hard.at/assets/img/logo/Logo-RVHard.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"></noscript>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/fotos/assets/galerie.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/img/logo/RV_Hard_Logo.webp">
</head>
<body>
    <header>
        <nav id="navigation-container"></nav>
    </header>

    <main>
        <section class="fg-container">

            <div class="fg-section" data-aos="fade-up">
                <h1 style="display:flex; align-items:center; gap: 0.75rem; flex-wrap: wrap;">
                    <span style="background: linear-gradient(135deg, #ffc107, #f5b301); color: #111; padding: 0.35rem 0.75rem; border-radius: 12px; font-size: 1.25rem;">
                        SBS
                    </span>
                    <span>Summer Bike Series – Foto-Galerie</span>
                </h1>

                <p class="lead" style="margin-top: 0.75rem;">
                    Alle Bilder der <strong style="color:#111;">Summer Bike Series</strong> auf einen Blick.
                    Gib einfach deine <strong style="color:#f5b301; font-size:1.05rem;">Startnummer</strong> ein – du findest sofort alle Fotos von dir!
                </p>

                <div style="display:flex; flex-wrap: wrap; gap: 10px; margin-bottom: 0.5rem;">
                    <a href="/fotos/admin/index.html" class="fg-btn" style="background: linear-gradient(135deg, #198754, #157347); color: #fff;">
                        <i class="fa-solid fa-lock"></i> Admin: Bilder hochladen & taggen
                    </a>
                    <a href="#so-funktionierts" class="fg-btn fg-btn--outline">
                        <i class="fa-regular fa-lightbulb"></i> So funktioniert die Nummernsuche
                    </a>
                </div>

                <div class="fg-search-row" style="margin-top: 1.5rem;">
                    <input type="search" id="fg-search" placeholder="🔍 Suche nach Ort, Name, Startnummer…" aria-label="SBS Events durchsuchen" style="min-width: 260px;">
                    <select id="fg-filter-year" aria-label="SBS Jahr Filter">
                        <option value="all">Alle SBS Jahre</option>
                    </select>
                    <select id="fg-filter-discipline" aria-label="Disziplin Filter">
                        <option value="all">Alle Disziplinen</option>
                        <option value="bergrennen">🏔️ Bergrennen</option>
                        <option value="ezf">⏱️ Einzelzeitfahren (EZF)</option>
                        <option value="kriterium">🏁 Kriterium Stadtkurs</option>
                    </select>
                </div>

                <div id="fg-info" class="fg-results-info">
                    <span>Lade SBS Events…</span>
                </div>

                <div id="fg-events" class="fg-events-grid" style="margin-top:10px;">
                    <div class="fg-empty"><strong>SBS Foto-Galerie wird geladen…</strong></div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="/assets/navigation-loader.js" defer></script>
    <script src="/assets/nav.js" defer></script>
    <script src="/fotos/assets/galerie.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.js" defer></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof AOS !== 'undefined') {
                AOS.init({ duration: 800, once: true, mirror: false });
            }
        });
    </script>
</body>
</html>
