<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>/* --- TEXT-KARUSSELL --- */
.text-carousel-container {
    max-width: 1000px;
    margin: 20px auto;
    text-align: center;
    background-color: #f8f9fa; /* Sehr dezentes Grau */
    padding: 20px;
    border-radius: 8px;
    border-left: 5px solid #0056b3; /* Farbiger Akzent am Rand */
}

.text-slide {
    display: none;
}

.text-slide h3 {
    margin: 0;
    font-size: 1.3rem;
    color: #333;
    font-weight: 500;
}

/* Weicher Fade-Effekt für den Text */
.fade {
    animation-name: fadeText;
    animation-duration: 1s;
}

@keyframes fadeText {
    from { opacity: 0 } 
    to { opacity: 1 }
}

/* --- ANMELDE-OVERLAY (Sticky Banner) --- */
.registration-overlay {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: #0056b3; /* Deine Haupt-Vereinsfarbe */
    color: white;
    z-index: 9999; /* Bleibt immer im Vordergrund */
    box-shadow: 0 -4px 10px rgba(0,0,0,0.15); /* Schatten nach oben */
    padding: 15px 20px;
    box-sizing: border-box;
}

.overlay-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    gap: 20px;
    flex-wrap: wrap; /* Bricht auf Handys in die nächste Zeile um */
}

.overlay-text {
    font-size: 1.1rem;
    flex-grow: 1;
}

.overlay-buttons {
    display: flex;
    gap: 10px;
    align-items: center;
}

/* Anmeldung-Button */
.btn-primary {
    background-color: #ffcc00;
    color: #111;
    padding: 10px 20px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
    transition: background 0.2s;
    white-space: nowrap;
}

.btn-primary:hover {
    background-color: #ffa500;
}

/* Schließen-Button */
.btn-close {
    background: transparent;
    border: 2px solid white;
    color: white;
    padding: 8px 15px;
    cursor: pointer;
    font-weight: bold;
    border-radius: 5px;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
}

.btn-close:hover {
    background: white;
    color: #0056b3;
}</style>
</head>

<body>
    <!-- 1. TEXT-KARUSSELL (Unter der Navigation) -->
<div class="text-carousel-container">
    <div class="text-slide fade">
        <h3>🏆 Die Anmeldung für den nächsten Wettkampf ist offiziell offen!</h3>
    </div>
    <div class="text-slide fade">
        <h3>⏱️ Early-Bird-Tarif: Sichere dir deinen Platz bis Ende des Monats.</h3>
    </div>
    <div class="text-slide fade">
        <h3>🏃‍♂️ Neue Streckenführung dieses Jahr – jetzt informieren!</h3>
    </div>
</div>

<!-- 2. ANMELDE-OVERLAY (Wie ein Cookie-Banner) -->
<div id="registration-overlay" class="registration-overlay">
    <div class="overlay-content">
        <span class="overlay-text">
            <strong>Die Anmeldung ist geöffnet!</strong> Sei beim nächsten Event dabei.
        </span>
        <div class="overlay-buttons">
            <a href="anmeldung.php" class="btn-primary">Jetzt anmelden</a>
            <button onclick="closeBanner()" class="btn-close">✖ Schließen</button>
        </div>
    </div>
</div>
</body>
<script>
    // --- TEXT KARUSSELL LOGIK ---
let textIndex = 0;
showTextSlides();

function showTextSlides() {
    let slides = document.getElementsByClassName("text-slide");
    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";  
    }
    textIndex++;
    if (textIndex > slides.length) {textIndex = 1}    
    slides[textIndex-1].style.display = "block";  
    
    // Wechselt den Text alle 4 Sekunden (4000 Millisekunden)
    setTimeout(showTextSlides, 4000); 
}

// --- OVERLAY BANNER SCHLIESSEN ---
function closeBanner() {
    document.getElementById("registration-overlay").style.display = "none";
}
</script>
</html>
